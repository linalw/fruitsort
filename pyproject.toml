[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitsort"
version = "0.6.0"
description = "Embodied AI research on robotic fruit sorting"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 按需安装，避免污染共享环境
viz = ["rerun-sdk", "matplotlib"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

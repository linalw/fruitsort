# 基础配置：所有实验从这里继承，实验变体放 configs/exp/
project: fruitsort
seed: 0
device: cuda

paths:
  data: data/datasets
  ckpt: data/checkpoints
  runs: runs

task:
  name: FruitSort-v0
  num_objects: 5
  max_episode_steps: 300
  control_hz: 10

train:
  batch_size: 64
  lr: 1.0e-4
  epochs: 100
  num_workers: 8
  amp: true
  grad_clip: 1.0
  checkpoint_every: 10

eval:
  n_episodes: 100
  seeds: [0, 1, 2]
  save_video: true
  video_every: 20

logging:
  backend: tensorboard   # tensorboard | wandb
  log_every: 50
